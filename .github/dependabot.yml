# Bağımlılıklar ve Action sürümleri için haftalık güncelleme pull request'leri açar.
# Her biri CI'dan geçmeden birleştirilmemeli.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # TypeScript 7'yi typescript-eslint ve openapi-typescript henüz desteklemiyor
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
