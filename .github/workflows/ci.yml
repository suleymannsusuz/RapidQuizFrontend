name: CI

on:
  pull_request:
  push:
    branches: [main]

# Varsayılan olarak yalnızca okuma izni; iş akışı kimlik bilgisi saklamaz.
permissions:
  contents: read

# Aynı dal için eski çalışmayı iptal et
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Denetimler ve birim testler
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Biçim (Prettier)
        run: npm run format:check

      - name: Tip denetimi
        run: npm run type-check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Birim ve bileşen testleri
        run: npm test

      - name: Üretim derlemesi
        run: npm run build

  e2e:
    name: Uçtan uca testler (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Testler gerçek backend ister: backend repo'sunun main dalı (herkese açık repo)
      - name: Backend kodunu çek
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: suleymannsusuz/RapidQuizBackend
          path: backend
          persist-credentials: false

      - name: "Backend'i başlat (Docker Compose: Django + PostgreSQL)"
        working-directory: backend
        run: docker compose up -d --build

      - name: Backend hazır olana kadar bekle
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health/; then echo; exit 0; fi
            sleep 2
          done
          echo "Backend 2 dakikada hazır olmadı" >&2
          exit 1

      - name: Veritabanını hazırla ve soruları yükle
        working-directory: backend
        run: |
          docker compose exec -T web python manage.py migrate --noinput
          docker compose exec -T web python manage.py load_questions

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Tarayıcıyı kur
        run: npx playwright install --with-deps chromium --only-shell

      - name: Uçtan uca testler
        run: npm run test:e2e

      - name: Başarısızlıkta test raporunu sakla
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-raporu
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Başarısızlıkta backend günlükleri
        if: failure()
        working-directory: backend
        run: docker compose logs --no-color --tail=200
