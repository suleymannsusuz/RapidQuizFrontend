name: rapid-quiz-web
region: fra

static_sites:
  - name: web
    github:
      repo: suleymannsusuz/RapidQuizFrontend
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    output_dir: dist
    index_document: index.html
    catchall_document: index.html
    envs:
      - key: VITE_API_BASE_URL
        scope: BUILD_TIME
        value: https://<backend-alan-adi>/api/v1
